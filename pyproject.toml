[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voyages"
version = "0.1.0"
description = "A Python map generation toolbox for travel cartography."
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "cartopy>=0.23",
    "fastapi>=0.115",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "pillow>=10",
    "pydantic>=2.9",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-Pillow",
    "types-PyYAML",
]

[project.scripts]
voyages = "voyages.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voyages"]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PT",  # flake8-pytest-style
    "ERA", # eradicate (commented-out code)
    "PL",  # pylint
]
ignore = [
    "S101",   # assert allowed in tests
    "PLR09",  # too-many-* (we'll tune later)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["voyages"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "cartopy.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -q"
